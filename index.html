<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Larder — The week's meals, on paper</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f7f4ef">
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <header>
    <h1>Larder</h1>
    <p class="tagline">The week's meals, on paper.</p>
    <nav aria-label="Primary" class="top-nav">
      <a href="#today">Today</a>
      <a href="#week">Week</a>
      <a href="#meals">Meals</a>
      <a href="#shop">Shop</a>
      <a href="#pantry">Pantry</a>
      <a href="#review">Review</a>
      <a href="#settings">Settings</a>
    </nav>
  </header>
  <main id="main">
    <section id="today" class="page">
      <h2>Today</h2>
      <div id="today-content">Loading…</div>
    </section>
    <section id="week" class="page" hidden>
      <h2>Week</h2>
      <div id="week-content"></div>
    </section>
    <section id="meals" class="page" hidden>
      <h2>The book</h2>
      <div id="meals-content"></div>
    </section>
    <section id="shop" class="page" hidden>
      <h2>Shop</h2>
      <div id="shop-content"></div>
    </section>
    <section id="pantry" class="page" hidden>
      <h2>Pantry</h2>
      <div id="pantry-content"></div>
    </section>
    <section id="review" class="page" hidden>
      <h2>Review</h2>
      <div id="review-content"></div>
    </section>
    <section id="settings" class="page" hidden>
      <h2>Settings</h2>
      <div id="settings-content"></div>
    </section>
  </main>
  <nav class="bottom-tabs" aria-label="Primary mobile">
    <a href="#today" data-tab="today"><span>Today</span></a>
    <a href="#week" data-tab="week"><span>Week</span></a>
    <a href="#shop" data-tab="shop"><span>Shop</span></a>
    <a href="#pantry" data-tab="pantry"><span>Pantry</span></a>
    <a href="#settings" data-tab="more"><span>More</span></a>
  </nav>
  <div id="sheet-backdrop" hidden></div>
  <div id="meal-sheet" class="bottom-sheet" hidden role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <h3 id="sheet-title">Meal</h3>
    <div id="sheet-actions"></div>
    <button type="button" id="sheet-close" class="secondary">Close</button>
  </div>
  <script type="module" src="app.js"></script>
  <script type="module" src="ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</body>
</html>
