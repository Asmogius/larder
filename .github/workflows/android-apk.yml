name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "capacitor/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        working-directory: capacitor
        run: |
          npm ci
          npm install --no-save @capacitor/cli@^8.6.0
          npx cap sync android

      - name: Build APK
        working-directory: capacitor/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/larder.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: larder-debug-apk
          path: capacitor/android/app/build/outputs/apk/debug/larder.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Larder (latest)
          body: |
            Latest Android APK (debug-signed).
            Download **larder.apk** and install on your phone. See README for install steps.
            Your plans, recipes, and pantry are kept when updating.
          files: capacitor/android/app/build/outputs/apk/debug/larder.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
